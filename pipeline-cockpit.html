<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>DashRite — Pipeline Cockpit</title>
<style>
:root{--bg:#0d1526;--card:#141d33;--card2:#101a30;--line:#26314c;--tx:#e8ecf5;--mut:#8892aa;--red:#e0304a;--grn:#2fbf71;--acc:#9184d9;--amb:#e0a45c;--blue:#7fd4ff}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 90px}
h1{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0 0 3px;background:linear-gradient(90deg,#ff5a3c,#e0304a 55%,#b02338);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:16px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:96px}
.stat b{display:block;font-size:20px;font-weight:800}
.stat.gd b{color:var(--grn)}.stat.wn b{color:var(--acc)}
.stat span{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{border-color:var(--acc);color:var(--tx);background:#1a2340}
.bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.bar input,.bar select{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 11px;font-size:13px}
.bar input.s{flex:1;min-width:190px}
.bar button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer}
.bar button.on{border-color:var(--acc);color:var(--tx)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{background:var(--card2);color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;z-index:2}
td.num{color:var(--mut);font-variant-numeric:tabular-nums;width:30px}
.d{color:var(--mut);font-size:11px;margin-top:2px}
.tier{display:inline-block;min-width:18px;text-align:center;border-radius:5px;font-weight:700;font-size:10.5px;padding:2px 6px}
.tier.tA{background:rgba(47,191,113,.16);color:#5fe0a0;border:1px solid rgba(47,191,113,.4)}
.tier.tB{background:rgba(145,132,217,.16);color:#b9aef0;border:1px solid rgba(145,132,217,.4)}
td.ph a{color:var(--blue);text-decoration:none;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:20px;font-size:10.5px;font-weight:600;padding:2px 9px;border:1px solid var(--line);color:var(--mut);cursor:pointer;white-space:nowrap}
.pill.New{border-color:#3a4straightforward}
.st-New{border-color:#39456a;color:#aeb8d4}
.st-Attempted{border-color:#7a6a3a;color:var(--amb);background:rgba(224,164,92,.1)}
.st-Reached{border-color:#3a6a7a;color:var(--blue);background:rgba(127,212,255,.1)}
.st-Meeting{border-color:#6a4a8a;color:#c3aef0;background:rgba(145,132,217,.14)}
.st-Proposal{border-color:#8a5a3a;color:#f0b98e;background:rgba(224,120,60,.14)}
.st-Won{border-color:#2fbf71;color:#5fe0a0;background:rgba(47,191,113,.18)}
.st-Lost{border-color:#7a3a44;color:#e88;background:rgba(224,48,74,.12)}
tr.hide{display:none}
.na{font-size:11px;color:var(--mut)}
.na.due{color:var(--amb)}.na.over{color:var(--red);font-weight:700}
.drawer-bg{position:fixed;inset:0;background:rgba(4,8,18,.66);display:none;z-index:40}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:var(--card);border-left:1px solid var(--line);z-index:41;display:none;flex-direction:column;overflow:auto}
.drawer.open,.drawer-bg.open{display:flex}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dh h2{margin:0 0 2px;font-size:18px}
.db{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit}
.fld textarea{min-height:60px;resize:vertical}
.stagerow{display:flex;gap:5px;flex-wrap:wrap}
.stagerow .pill{padding:5px 10px}
.stagerow .pill.sel{outline:2px solid var(--acc)}
.log{display:flex;flex-direction:column;gap:7px}
.logitem{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
.logitem .t{color:var(--mut);font-size:10.5px}
.btn{background:transparent;border:1px solid var(--acc);color:var(--tx);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn.red{border-color:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.close{background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer;position:absolute;top:14px;right:16px}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px}
.kcol{flex:0 0 240px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.kcol h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.kcard b{font-size:13px}.kcard .m{font-size:11px;color:var(--mut);margin-top:2px}
.dupe{color:var(--amb);font-size:10px}
.foot{color:var(--mut);font-size:11px;margin-top:18px;line-height:1.6}
.hidecol{display:none}
</style></head><body><div class="wrap">

var KEY='dashrite_pipeline_v1';
var STAGES=['New','Attempted','Reached','Meeting','Proposal','Won','Lost'];
var store=JSON.parse(localStorage.getItem(KEY)||'{}');
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
function rec(id){if(!store[id])store[id]={stage:'New',next:'',value:0,log:[]};if(store[id].value===undefined)store[id].value=0;return store[id];}
var WT={New:0,Attempted:.05,Reached:.15,Meeting:.30,Proposal:.60,Won:1,Lost:0};
function money(n){return '$'+Math.round(n).toLocaleString();}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tel(p){var d=(p||'').replace(/[^0-9]/g,'');return d.length>=10?'tel:'+d:'';}
function today(){return new Date().toISOString().slice(0,10);}
function phCell(p){var t=tel(p);return t?'<a href="'+t+'">'+esc(p)+'</a>':esc(p||'—');}
function nextCls(n){if(!n)return'';if(n<today())return'over';if(n===today())return'due';return'';}
function nextTxt(n){if(!n)return'';if(n<today())return'⚠ '+n;if(n===today())return'● today';return n;}

var curT='',curV='list';
function renderStats(){
  var w=0,lost=0,active=0,due=0,wpipe=0,won$=0;
  LEADS.forEach(function(l){var r=store[l.id];if(!r)return;if(r.stage==='Won'){w++;won$+=(+r.value||0);}else if(r.stage==='Lost')lost++;else if(r.stage!=='New')active++;if(r.next&&r.next<=today()&&r.stage!=='Won'&&r.stage!=='Lost')due++;if(r.stage!=='Won'&&r.stage!=='Lost')wpipe+=(+r.value||0)*WT[r.stage];});
  document.getElementById('stats').innerHTML=
    '<div class="stat"><b>408</b><span>verified A/B</span></div>'+
    '<div class="stat"><b>'+active+'</b><span>in motion</span></div>'+
    '<div class="stat"><b>'+due+'</b><span>due / overdue</span></div>'+
    '<div class="stat"><b>'+money(wpipe)+'</b><span>weighted pipeline</span></div>'+
    '<div class="stat wn"><b>'+w+'</b><span>won'+(won$?' · '+money(won$):'')+'</span></div>'+
    '<div class="stat"><b>'+lost+'</b><span>lost</span></div>';
}
function rowHtml(l,i){var r=rec(l.id);
  return '<tr data-id="'+l.id+'" data-state="'+esc(l.state)+'" data-tier="'+l.tier+'" data-stage="'+r.stage+'">'+
   '<td class="num">'+(i+1)+'</td><td><span class="tier t'+l.tier+'">'+l.tier+'</span></td>'+
   '<td>'+esc(l.state)+'</td>'+
   '<td><strong>'+esc(l.company)+'</strong>'+(l.dupe?' <span class="dupe">⧉ dup</span>':'')+'<div class="d">'+esc(l.disc)+' · '+esc(l.city)+'</div></td>'+
   '<td>'+esc(l.dm||'—')+'</td><td class="ph">'+phCell(l.phone)+'</td>'+
   '<td><span class="pill st-'+r.stage+'">'+r.stage+'</span></td>'+
   '<td class="na '+nextCls(r.next)+'">'+nextTxt(r.next)+'</td></tr>';
}
function renderList(){
  var tb=document.getElementById('tb');tb.innerHTML=LEADS.map(rowHtml).join('');
  applyFilters();
}
function applyFilters(){
  var s=document.getElementById('q').value.toLowerCase(),st=document.getElementById('stf').value,ds=document.getElementById('dsf').value,due=document.getElementById('opendue').classList.contains('on');
  [].forEach.call(document.getElementById('tb').rows,function(r){
    var id=r.dataset.id,rr=store[id]||{stage:'New',next:''};
    var txt=r.textContent.toLowerCase();
    var ok=(!s||txt.indexOf(s)>-1)&&(!st||r.dataset.state===st)&&(!curT||r.dataset.tier===curT)&&(!ds||rr.stage===ds)&&(!due||(rr.next&&rr.next<=today()&&rr.stage!=='Won'&&rr.stage!=='Lost'));
    r.classList.toggle('hide',!ok);});
}
function renderToday(){
  var out=[];
  LEADS.forEach(function(l){var r=store[l.id];if(r&&r.next&&r.next<=today()&&r.stage!=='Won'&&r.stage!=='Lost')out.push({l:l,why:(r.next<today()?'Overdue '+r.next:'Due today'),stage:r.stage});});
  LEADS.forEach(function(l){var r=store[l.id]||{stage:'New'};if((!r||r.stage==='New')&&out.length<15&&l.tier==='A')out.push({l:l,why:'Fresh Tier A',stage:'New'});});
  out=out.slice(0,20);
  document.getElementById('todaysub').textContent=out.length?out.length+' to work today — overdue follow-ups first, then fresh Tier A by priority order':'Nothing due. Pick fresh Tier A from the call list to start.';
  document.getElementById('tbtoday').innerHTML=out.map(function(o,i){var l=o.l,r=rec(l.id);
    return '<tr data-id="'+l.id+'"><td class="num">'+(i+1)+'</td><td><span class="tier t'+l.tier+'">'+l.tier+'</span></td><td>'+esc(l.state)+'</td>'+
    '<td><strong>'+esc(l.company)+'</strong><div class="d">'+esc(l.city)+'</div></td><td class="ph">'+phCell(l.phone)+'</td><td>'+o.why+'</td><td><span class="pill st-'+r.stage+'">'+r.stage+'</span></td></tr>';}).join('');
}
function renderBoard(){
  var kan=document.getElementById('kan');var cols=STAGES.map(function(s){return '<div class="kcol" data-stage="'+s+'"><h3>'+s+' <span>'+LEADS.filter(function(l){return rec(l.id).stage===s;}).length+'</span></h3>'+
    LEADS.filter(function(l){return rec(l.id).stage===s;}).map(function(l){return '<div class="kcard" draggable="true" data-id="'+l.id+'"><b>'+esc(l.company)+'</b><div class="m"><span class="tier t'+l.tier+'">'+l.tier+'</span> '+esc(l.state)+' · '+esc(l.city)+(rec(l.id).value?' · '+money(rec(l.id).value):'')+'</div></div>';}).join('')+'</div>';}).join('');
  kan.innerHTML=cols;
  document.querySelectorAll('#kan .kcard').forEach(function(k){k.addEventListener('dragstart',function(e){e.dataTransfer.setData('id',k.dataset.id);});});
  document.querySelectorAll('#kan .kcol').forEach(function(col){
    col.addEventListener('dragover',function(e){e.preventDefault();col.style.outline='2px solid var(--acc)';});
    col.addEventListener('dragleave',function(){col.style.outline='';});
    col.addEventListener('drop',function(e){e.preventDefault();col.style.outline='';var id=e.dataTransfer.getData('id');if(!id)return;var r=rec(id);var ns=col.dataset.stage;if(r.stage!==ns){r.stage=ns;if(!r.log)r.log=[];r.log.unshift({t:new Date().toLocaleString(),n:'→ stage: '+ns+' (dragged)'});save();renderStats();renderBoard();}});
  });
}
function openDrawer(id){
  var l=LEADS.find(function(x){return x.id===id;});if(!l)return;var r=rec(id);
  var tmplOpener="Subject: A number worth a look — "+l.company+"\n\nHi"+(l.dm&&l.dm!=='—'?' '+l.dm.split(' ')[0]:'')+",\n\nI run DashRite Advisory — we find the six-figure errors hiding in mid-market operations (landed cost, forecasting, the close) and build the systems that end them, in the tools you already own.\n\nWorth a short call? First look is free — real findings, a real number, then you decide.\n\nWith thanks,\nTimothy Edick, CEO\nDashRite Advisory LLC · dashriteadvisory@gmail.com";
  var c='<div class="dh"><h2>'+esc(l.company)+'</h2><div class="d"><span class="tier t'+l.tier+'">'+l.tier+'</span> '+esc(l.state)+' · '+esc(l.city)+' · '+esc(l.disc)+'</div></div><div class="db">';
  c+='<div class="fld"><label>Decision maker</label><input id="f_dm" value="'+esc(l.dm||'')+'" readonly></div>';
  c+='<div class="fld"><label>Phone</label><div style="font-size:15px">'+phCell(l.phone)+'</div></div>';
  c+='<div class="fld"><label>Stage</label><div class="stagerow" id="stages">'+STAGES.map(function(s){return '<span class="pill st-'+s+(r.stage===s?' sel':'')+'" data-s="'+s+'">'+s+'</span>';}).join('')+'</div></div>';
  c+='<div class="fld"><label>Next action date</label><input type="date" id="f_next" value="'+(r.next||'')+'"></div>';
  c+='<div class="fld"><label>Deal value (est. annual $)</label><input type="number" id="f_val" value="'+(r.value||'')+'" placeholder="0" min="0" step="500"></div>';
  c+='<div class="fld"><label>Log a touch</label><textarea id="f_note" placeholder="left VM · gatekeeper · emailed opener…"></textarea><div class="btnrow" style="margin-top:8px"><button class="btn" id="addnote">Add to log</button><button class="btn" id="draftemail">Draft opener</button></div></div>';
  c+='<div class="fld"><label>Activity log</label><div class="log" id="loglist">'+(r.log.length?r.log.map(function(x){return '<div class="logitem"><div class="t">'+x.t+'</div>'+esc(x.n)+'</div>';}).join(''):'<div class="na">No activity yet.</div>')+'</div></div>';
  c+='<textarea id="tmpl" style="position:absolute;left:-9999px">'+tmplOpener+'</textarea>';
  c+='</div>';
  document.getElementById('dcontent').innerHTML=c;
  document.getElementById('dbg').classList.add('open');document.getElementById('drw').classList.add('open');
  document.querySelectorAll('#stages .pill').forEach(function(p){p.onclick=function(){r.stage=p.dataset.s;if(!r.log)r.log=[];r.log.unshift({t:new Date().toLocaleString(),n:'→ stage: '+r.stage});save();openDrawer(id);refresh();};});
  document.getElementById('f_next').onchange=function(e){r.next=e.target.value;save();refresh();};
  document.getElementById('f_val').onchange=function(e){r.value=+e.target.value||0;save();refresh();};
  document.getElementById('addnote').onclick=function(){var v=document.getElementById('f_note').value.trim();if(!v)return;r.log.unshift({t:new Date().toLocaleString(),n:v});save();openDrawer(id);refresh();};
  document.getElementById('draftemail').onclick=function(){var t=document.getElementById('tmpl');t.style.left='0';t.select();try{document.execCommand('copy');}catch(e){}t.style.left='-9999px';var b=document.getElementById('draftemail');b.textContent='Copied ✓';setTimeout(function(){b.textContent='Draft opener';},1500);r.log.unshift({t:new Date().toLocaleString(),n:'Drafted email opener (copied)'});save();};
}
function closeDrawer(){document.getElementById('dbg').classList.remove('open');document.getElementById('drw').classList.remove('open');}
function refresh(){renderStats();if(curV==='list')applyFilters(),document.getElementById('tb').innerHTML=LEADS.map(rowHtml).join(''),applyFilters();if(curV==='today')renderToday();if(curV==='board')renderBoard();}
document.getElementById('dbg').onclick=closeDrawer;document.getElementById('dclose').onclick=closeDrawer;
document.getElementById('tb').onclick=function(e){var tr=e.target.closest('tr');if(tr&&!e.target.closest('a'))openDrawer(tr.dataset.id);};
document.getElementById('tbtoday').onclick=function(e){var tr=e.target.closest('tr');if(tr&&!e.target.closest('a'))openDrawer(tr.dataset.id);};
document.getElementById('kan').onclick=function(e){var k=e.target.closest('.kcard');if(k)openDrawer(k.dataset.id);};
document.getElementById('q').oninput=applyFilters;document.getElementById('stf').onchange=applyFilters;document.getElementById('dsf').onchange=applyFilters;
document.querySelectorAll('.tf').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tf').forEach(function(x){x.classList.remove('on')});b.classList.add('on');curT=b.dataset.t;applyFilters();};});
document.getElementById('opendue').onclick=function(){this.classList.toggle('on');applyFilters();};
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});b.classList.add('on');curV=b.dataset.v;
  document.getElementById('v-list').classList.toggle('hidecol',curV!=='list');
  document.getElementById('v-today').classList.toggle('hidecol',curV!=='today');
  document.getElementById('v-board').classList.toggle('hidecol',curV!=='board');
  refresh();};});
document.getElementById('foot').innerHTML='Stages: New → Attempted → Reached → Meeting → Proposal → Won / Lost. Your pipeline saves to this browser only (localStorage) — same browser, same device keeps your progress; it is not shared or synced. Export/backup on request. Verified = confirmed family/founder ownership + in-band ($10M–$150M), live-checked in each state expansion file.';
renderStats();renderList();

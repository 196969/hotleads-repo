<!doctype html><html lang="en"><head><meta charset="utf-8"><title>DashRite · Operator Console — Florida</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1117;--panel:#161a24;--ink:#e8eaf0;--mut:#9397ab;--line:#262b38;--ok:#5ec97a;--warn:#e0a45c;--bad:#d9634e;--acc:#6ea8ff}
*{box-sizing:border-box}body{margin:0;font:13px/1.4 Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
header h1{font-size:15px;margin:0 8px 0 0}.pill{border:1px solid var(--line);border-radius:12px;padding:2px 8px;color:var(--mut)}.pill b{color:var(--ink)}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--line);background:#12151e;align-items:center}
select,input,button,textarea{font:inherit;background:#0b0d13;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
button{cursor:pointer}button.p{background:var(--acc);color:#000;border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
#filters{color:var(--mut)}#filters b{color:var(--ink)}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}th{position:sticky;top:46px;background:var(--panel);cursor:pointer;white-space:nowrap}
tr.r:hover{background:#1a1f2b}.badge{display:inline-block;border-radius:3px;padding:1px 5px;font-size:11px;margin-right:3px}.ok{background:#1e3b2a;color:var(--ok)}.warn{background:#3b2f1e;color:var(--warn)}.bad{background:#3b1f1e;color:var(--bad)}.mut{color:var(--mut)}
#panel{position:fixed;right:0;top:0;width:min(560px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px;display:none;z-index:6}
#panel.open{display:block}#panel h2{font-size:14px;margin:0 0 6px}.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.disp{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.disp button{text-align:left}.disp kbd{color:var(--mut);margin-right:6px}
textarea{width:100%;min-height:200px}.hist{font-size:12px;color:var(--mut);max-height:160px;overflow:auto;border:1px solid var(--line);padding:6px}
.refuse{background:#3b1f1e;color:var(--bad);padding:6px;border-radius:4px;margin:6px 0}.note{color:var(--mut);font-size:12px}
@media print{header,.bar,#panel,button{display:none!important}body{background:#fff;color:#000}th,td{border:1px solid #999}}
</style></head><body>
<header><h1>Operator Console · Florida</h1>
<span class="pill">due today <b id="cDue">0</b></span><span class="pill">done today <b id="cDone">0</b></span><span class="pill">left <b id="cLeft">0</b></span>
<span class="pill">on screen <b id="cOn">0</b> of <b id="cAll">0</b></span><span class="pill">queue <b id="cQ">0</b></span>
<span class="pill" id="who"></span>
<button id="bToday">Daily worklist</button><button id="bAll">All rows</button><button id="bQueue">Queue</button><button id="bSheet">Call sheet</button><button id="bSettings">Settings</button>
<button id="bExportJson">Export outreach JSON</button><button id="bExportCsv">Export CSV</button><span class="note" id="saved"></span></header>
<div class="bar">
<input id="fText" placeholder="company or person" style="width:200px">
<select id="fGround"><option value="">ground: all</option></select><select id="fTier"><option value="">tier: all</option><option>A</option><option>B</option><option>C</option></select>
<select id="fWork"><option value="">workable: all</option><option value="1">workable</option><option value="0">not workable</option></select>
<select id="fClass"><option value="">class: all</option><option>Live</option><option>Stale</option><option>Unsourced</option><option>Suspect</option><option>Not real</option></select>
<select id="fElig"><option value="">eligibility: all</option><option value="strict">eligible (strict)</option><option value="addr">address-eligible</option><option value="blocked">blocked</option></select>
<select id="fStatus"><option value="">status: all</option></select><select id="fTouch"><option value="">touch: all</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
<select id="fDisp"><option value="">disposition: all</option></select><input id="fNext" type="date" title="next action on or before">
<button id="fClear">Clear</button><button id="bSelAll">Select all on screen</button><button id="bSched" class="p">Schedule selected into cadence</button>
<span id="filters"></span></div>
<div id="main"></div>
<div id="panel"></div>
<script>
/* Inherited verbatim from florida.html's composer (script 1) — tone presets, resource links, body builder */
var st='Florida';
var TONES={first:{s:st+', you\u2019re up next \u2014 DashRite Advisory',i:function(co){return st+', you\u2019re up next. We help owner-led businesses like '+co+' become more profitable and less chaotic \u2014 the brand and marketing that get you noticed, and the operations underneath that keep every promise once the phone rings. Built in the tools you already own, yours the day we leave.';},c:'First look is free: a findings review and a scoped number. Implementation is the paid engagement.\n\nWorth 20 minutes?\n\nTim'},follow:{s:'Following up \u2014 DashRite Advisory',i:function(co){return 'Circling back on my note about helping '+co+' run more profitable and less chaotic \u2014 brand and marketing that get you noticed, and the operations underneath that keep every promise.';},c:'The first look is still free: a findings review and a scoped number, no obligation.\n\nWorth 20 minutes this week?\n\nTim'},breakup:{s:'Closing the loop \u2014 DashRite Advisory',i:function(co){return 'I\u2019ll stop here so I\u2019m not crowding your inbox. If '+co+' ever wants a second set of eyes on the numbers, the offer stands.';},c:'The free findings review is open whenever the timing\u2019s right. All the best.\n\nTim'}};

function res(p1,p2,site,sv,ab,q,ha,who){var r=[];if(who)r.push('Who we are, what we do:\nhttps://196969.github.io/hotleads-repo/who-we-are-what-we-do.html');if(site)r.push('How we work in '+st+':\nhttps://196969.github.io/DashRite-Advisory-/state-'+slug+'.html');if(sv)r.push('Services and pricing:\nhttps://196969.github.io/DashRite-Advisory-/services.html');if(q)r.push('Request a scoped number:\nhttps://196969.github.io/DashRite-Advisory-/quote.html');if(ha)r.push('60-second Business Health Assessment (5 questions):\nhttps://196969.github.io/hotleads-repo/DashRite-Business-Health-Assessment.pdf');return r.length?'\n\nA quick look at how we work in '+st+':\n\n'+r.join('\n\n'):'';}
function build(first,co,tone,rs){var T=TONES[tone];return 'Hi '+(first||'there')+',\n\n'+T.i(co)+rs+'\n\n'+T.c;}

/* ===================== the spine: data, outreach state, eligibility, stop rules ===================== */
var MARKET='florida', D=function(d){d=d||new Date();return d.toISOString().slice(0,10)}, TODAY=D();
var KEY='dra-outreach-'+MARKET, LEGACY='dr-pipe-'+MARKET;
var DISP=[['1','No reply','noreply'],['2','Reached, interested','interested'],['3','Reached, not now','notnow'],['4','Reached, no','no'],['5','Wrong person','wrongperson'],['6','Wrong number','wrongnumber'],['7','Gatekeeper','gatekeeper'],['8','Left voicemail','voicemail'],['9','Bounced','bounced'],['0','Unsubscribed','unsub'],['-','Do not contact','dnc']];
var TERMINAL={interested:'reply — handed to the human',no:'reply — handed to the human',bounced:'bounce — address marked unsourced, row returned to acquisition',unsub:'unsubscribe — honoured, never re-enters outreach',dnc:'do-not-contact — set by the Chair'};
var CAD=[[0,'First approach'],[3,'A second angle'],[8,'The one-page proof'],[15,'A short, direct ask'],[25,'The call, from the published number'],[40,'Close the loop']];
var OPEN={ 'Distribution & Wholesale':'the margin that hides between landed cost and the price list — inventory ordering, carrying cost and quote discipline',
 'Manufacturing & Industrial':'job cost, machine-rate and quote margin — what a first look at the shop floor numbers returns',
 'Food & Beverage Processing':'yield, batch cost and the margin that hides in the line'};
var ROWS=[], STD={}, OUT={rows:{}}, FILE={rows:{}}, settings=JSON.parse(localStorage.getItem('dra-settings')||'{}'), view='today', sel={};
function load(){var p1=fetch('florida.html').then(function(r){return r.text()}).then(parseRows);var p2=fetch(MARKET+'-standard.json').then(function(r){return r.json()}).then(function(j){STD=j.rows||{};STD._measured=j.measured});var p3=fetch(MARKET+'-outreach.json').then(function(r){return r.json()}).catch(function(){return {rows:{}}}).then(function(j){FILE=j;});
 return Promise.all([p1,p2,p3]).then(function(){var loc=null;try{loc=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){} OUT=merge(FILE,loc);migrateLegacy();save(false);render();});}
function parseRows(html){var doc=new DOMParser().parseFromString(html,'text/html');var tb=doc.querySelector('#tb');var table=tb?tb.closest('table'):doc.querySelector('table');var hr=[].slice.call(table.querySelectorAll('tr')).filter(function(r){return r.querySelector('th')})[0];var H={};[].forEach.call(hr.children,function(c,i){H[c.textContent.replace(/\s+/g,' ').trim()]=i});
 var cell=function(tr,n){var i=H[n];return i==null?null:tr.children[i]};var txt=function(e){return e?e.textContent.replace(/\s+/g,' ').trim():''};
 ROWS=[].slice.call(table.querySelectorAll('tr')).filter(function(tr){return tr.children.length===Object.keys(H).length&&tr.querySelector('td')}).map(function(tr){var co=cell(tr,'Company'),dm=cell(tr,'Decision maker'),links=cell(tr,'Links');var site=links?[].slice.call(links.querySelectorAll('a[href^="http"]')).map(function(a){return a.href}).filter(function(h){return !/google\.|linkedin\./.test(h)})[0]:null;
  return {key:txt(cell(tr,'#')),company:txt(co&&co.querySelector('strong'))||txt(co),ground:txt(co&&co.querySelector('.sub')),city:txt(cell(tr,'City')),tier:txt(cell(tr,'Tier')),status:txt(cell(tr,'Status')),dm:txt(dm&&dm.querySelector('strong')),title:txt(dm&&dm.querySelector('.sub')),phone:txt(cell(tr,'Phone')),tel:(cell(tr,'Phone')&&cell(tr,'Phone').querySelector('a[href^="tel:"]')||{}).href||'',email:txt(cell(tr,'Email')),src:txt(cell(tr,'Address source')),site:site,notes:txt(cell(tr,'Notes'))};});}
function merge(file,loc){var o={rows:{}};var keys={};Object.keys(file.rows||{}).concat(Object.keys((loc||{}).rows||{})).forEach(function(k){keys[k]=1});Object.keys(keys).forEach(function(k){var a=(file.rows||{})[k],b=(loc||{}).rows?loc.rows[k]:null;if(a&&b)o.rows[k]=(b.updated||'')>=(a.updated||'')?b:a;else o.rows[k]=b||a;});return o;}
function migrateLegacy(){try{var L=JSON.parse(localStorage.getItem(LEGACY)||'null');if(!L||OUT.migrated)return;var n=0;Object.keys(L).forEach(function(co){var r=ROWS.filter(function(x){return x.company===co})[0];if(!r)return;var rec=rec0(r.key);if(!rec.legacy){rec.legacy={stage:L[co].stage,next:L[co].next,last:L[co].last,migrated:TODAY};n++;}});OUT.migrated={date:TODAY,rows:n};localStorage.setItem(LEGACY+'-retired',localStorage.getItem(LEGACY)||'');localStorage.removeItem(LEGACY);}catch(e){}}
function rec0(k){OUT.rows[k]=OUT.rows[k]||{touches:[],dispositions:[],terminal:null,next:'',by:'',updated:''};return OUT.rows[k];}
function save(flash){OUT.exported=OUT.exported||'';localStorage.setItem(KEY,JSON.stringify(OUT));if(flash!==false){document.getElementById('saved').textContent='saved '+new Date().toLocaleTimeString()}}
function std(r){return STD[r.key]||{tests:{},workable:false,class:'',band:4,bandTier:r.tier,ground:r.ground}}
function strict(r){var s=std(r);return !!s.workable&&!!r.src&&/@/.test(r.email)&&s.bandTier!=='C'}
function addrElig(r){return !!r.src&&/@/.test(r.email)&&!!r.dm&&std(r).bandTier!=='C'}
function blockers(r){var b=[];var s=std(r);if(!r.src)b.push(/@/.test(r.email)?'Address source empty (address on file, unsourced)':'Address source empty (no address held)');if(!r.dm)b.push('no named person');if(s.bandTier==='C')b.push('Tier C for banding');var t=s.tests||{};Object.keys(t).forEach(function(k){if(!t[k])b.push('standard: '+k)});return b;}
function touchNo(k){var o=OUT.rows[k];return o?o.touches.length:0}
function lastTouch(k){var o=OUT.rows[k];return o&&o.touches.length?o.touches[o.touches.length-1].date:''}
function lastDisp(k){var o=OUT.rows[k];return o&&o.dispositions.length?o.dispositions[o.dispositions.length-1]:null}
/* stop rules — enforced at send time by both drivers; a row that trips any leaves outreach */
function stopRule(r){var o=OUT.rows[r.key];if(!o)return null;if(o.terminal)return o.terminal.state+': '+o.terminal.reason;var d=lastDisp(r.key);if(d&&(d.code==='interested'||d.code==='no'||d.code==='bounced'||d.code==='unsub'||d.code==='dnc'))return 'disposition '+d.code;if(o.scheduledStatus&&o.scheduledStatus!==r.status)return 'company status changed since scheduling ('+o.scheduledStatus+' → '+r.status+')';if(o.touches.length>=6)return 'sequence complete — the row is quiet';return null;}
function sendGate(r){var why=[];if(!strict(r))why.push('not eligible (strict): '+(blockers(r).slice(0,3).join('; ')||'no sourced address'));if(!r.src)why.push('Address source empty — the send control is disabled');if(!settings.postal)why.push('no postal address in Settings — CAN-SPAM element missing');if(!settings.from)why.push('no sender identification in Settings');var s=stopRule(r);if(s)why.push('stop rule: '+s);return why;}
/* the cadence and the writer */
function bizAdd(from,n){var d=new Date(from+'T00:00:00');var k=0;while(k<n){d.setDate(d.getDate()+1);var w=d.getDay();if(w!==0&&w!==6)k++;}return D(d);}
function groundOf(r){return std(r).ground||r.ground}
function subjectFor(r,n){var g=groundOf(r);return ['DashRite · '+r.company+' — '+(OPEN[g]?OPEN[g].split(' — ')[0]:'a first look'),'A second angle for '+r.company,'One page: what a first look returns at '+r.company,'A short, direct ask — '+r.company,'Call scheduled — '+r.company,'Closing the loop — '+r.company][n-1];}
function bodyFor(r,n){var g=groundOf(r);var first=(r.dm||'').split(/\s+/)[0];if(!first)return null;var opening=OPEN[g];if(!opening)return null;var core={1:'Hi '+first+',\n\nAt '+r.company+' the question I would start with is '+opening+'. A first look is free and takes a week; it returns the three numbers that move first.',2:'Hi '+first+',\n\nA second angle: most '+g.toLowerCase()+' operators we see are carrying margin they cannot yet name. The first look shows where it sits at '+r.company+'.',3:'Hi '+first+',\n\nOne page: what a first look returns — the three measures, how they are read, and what changes when they are. Attached as the resource below.',4:'Hi '+first+',\n\nA short, direct ask: twenty minutes, your numbers, our method. If the timing is wrong, say so and I will close the file.',5:null,6:'Hi '+first+',\n\nClosing the loop: I will set '+r.company+' aside and not write again unless you ask. The free first look stays open whenever the timing is right.'}[n];if(core===null)return null;
 var foot='\n\n'+(settings.from||'')+' · DashRite Advisory\n'+(settings.postal||'')+'\nTo stop these messages, reply STOP — it is honoured at once and recorded; you will not be contacted again by this firm.';return core+foot;}
function schedule(keys){var n=0;keys.forEach(function(k){var r=ROWS.filter(function(x){return x.key===k})[0];if(!r||!strict(r))return;var o=rec0(k);if(o.cadence)return;var base=TODAY;o.cadence={ground:groundOf(r),entered:TODAY,by:'bot',queue:CAD.map(function(c,i){return {n:i+1,due:bizAdd(base,c[0]),kind:i===4?'call':'send',label:c[1],cancelled:false,done:false}})};o.scheduledStatus=r.status;o.updated=new Date().toISOString();n++;});save();render();return n;}
function queueEntries(){var q=[];ROWS.forEach(function(r){var o=OUT.rows[r.key];if(!o||!o.cadence)return;o.cadence.queue.forEach(function(e){if(e.cancelled||e.done)return;var gate=e.kind==='send'?sendGate(r):[];if(e.kind==='send'&&!bodyFor(r,e.n)){gate=gate.concat(['held — the writer has no opening for this ground ('+groundOf(r)+'); nothing is invented'])}q.push({row:r,e:e,gate:gate,subject:e.kind==='send'?subjectFor(r,e.n):'Call '+r.company+' at '+r.phone,body:e.kind==='send'?bodyFor(r,e.n):null,address:r.email});});});q.sort(function(a,b){return a.e.due<b.e.due?-1:1});return q;}
/* dispositions */
function dispose(r,code,note,next,user){var o=rec0(r.key);var d={code:code,label:DISP.filter(function(x){return x[2]===code})[0][1],date:TODAY,user:user||settings.user||'',note:note||'',next:next||'',by:'human'};if(code==='notnow'&&!next)return 'Reached, not now needs a next-action date or it does not save';o.dispositions.push(d);if(next)o.next=next;if(TERMINAL[code]){o.terminal={state:code,reason:TERMINAL[code],date:TODAY};if(o.cadence)o.cadence.queue.forEach(function(e){if(!e.done)e.cancelled='stop rule: '+code});o.handoff=(code==='interested'||code==='no')?{date:TODAY,flag:'reply — needs you'}:o.handoff;if(code==='bounced')o.addressUnsourced=true;}o.updated=new Date().toISOString();save();render();return null;}
/* ===================== the surfaces ===================== */
var $=function(s){return document.querySelector(s)};
function filters(){return {text:$('#fText').value.toLowerCase(),ground:$('#fGround').value,tier:$('#fTier').value,work:$('#fWork').value,cls:$('#fClass').value,elig:$('#fElig').value,status:$('#fStatus').value,touch:$('#fTouch').value,disp:$('#fDisp').value,next:$('#fNext').value}}
function population(){var f=filters();return ROWS.filter(function(r){var s=std(r);if(f.text&&!(r.company+' '+r.dm).toLowerCase().includes(f.text))return false;if(f.ground&&groundOf(r)!==f.ground)return false;if(f.tier&&r.tier!==f.tier)return false;if(f.work&&String(strict(r)?1:0)!==f.work)return false;if(f.cls&&s.class!==f.cls)return false;if(f.elig==='strict'&&!strict(r))return false;if(f.elig==='addr'&&!addrElig(r))return false;if(f.elig==='blocked'&&(strict(r)||addrElig(r)))return false;if(f.status&&r.status!==f.status)return false;if(f.touch&&String(touchNo(r.key))!==f.touch)return false;if(f.disp){var d=lastDisp(r.key);if(!d||d.code!==f.disp)return false}if(f.next){var o=OUT.rows[r.key];if(!o||!o.next||o.next>f.next)return false}return true;});}
function filterText(){var f=filters();var parts=[];Object.keys(f).forEach(function(k){if(f[k])parts.push(k+' = '+f[k])});return parts.length?parts.join(' · '):'no filter — every row'}
function badge(r){var s=std(r);var b='';b+=strict(r)?'<span class="badge ok">workable · eligible</span>':'<span class="badge bad" title="'+blockers(r).join('; ')+'">not workable: '+(blockers(r)[0]||'')+'</span>';b+=addrElig(r)?'<span class="badge warn">address-eligible</span>':'';b+='<span class="badge mut">'+(s.class||'')+' · band '+s.band+'</span>';var st=stopRule(r);if(st)b+='<span class="badge bad">left: '+st.split(':')[0]+'</span>';var o=OUT.rows[r.key];if(o&&o.handoff)b+='<span class="badge warn">'+o.handoff.flag+'</span>';return b;}
function rowHtml(r){var o=OUT.rows[r.key]||{};var d=lastDisp(r.key);return '<tr class="r" data-k="'+r.key+'"><td><input type="checkbox" class="sel" data-k="'+r.key+'"'+(sel[r.key]?' checked':'')+'></td><td>'+r.key+'</td><td><b>'+esc(r.company)+'</b><div class="mut">'+esc(r.ground)+' · '+esc(r.city)+'</div></td><td>'+esc(r.dm||'—')+'<div class="mut">'+esc(r.title)+'</div></td><td>'+(r.tel?'<a href="'+r.tel+'">'+esc(r.phone)+'</a>':esc(r.phone||'—'))+'</td><td>'+esc(r.email||'—')+'<div class="mut">'+(r.src?esc(r.src):'<span class="bad">source empty</span>')+'</div></td><td>'+r.tier+' <span class="mut">('+esc(std(r).bandTier)+')</span><div class="mut">'+esc(r.status)+'</div></td><td>'+badge(r)+'</td><td>'+touchNo(r.key)+'<div class="mut">'+(lastTouch(r.key)||'')+'</div></td><td>'+esc(o.next||'')+'</td><td>'+(d?esc(d.label)+'<div class="mut">'+d.date+'</div>':'')+'</td><td><button class="open" data-k="'+r.key+'">Work</button></td></tr>';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){var all=population();var pop=all;if(view==='today'){pop=all.filter(function(r){var o=OUT.rows[r.key];var due=o&&o.next&&o.next<=TODAY;var q=o&&o.cadence&&o.cadence.queue.some(function(e){return !e.done&&!e.cancelled&&e.due<=TODAY});var h=o&&o.handoff;return due||q||h;});pop.sort(function(a,b){var sa=std(a),sb=std(b);return (sa.band-sb.band)||a.tier.localeCompare(b.tier)||groundOf(a).localeCompare(groundOf(b))});}
 var done=ROWS.filter(function(r){var o=OUT.rows[r.key];return o&&o.dispositions.some(function(d){return d.date===TODAY})}).length;

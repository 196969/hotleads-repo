<style>

 var p5=fetch(MARKET+'-reads.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('status '+r.status);return r.json()}).then(function(j){READS=j.rows||{};READS._ok=true}).catch(function(e){READS={_ok:false,_err:String(e)}});
 return Promise.all([p1,p2,p3,p4,p5,p6,p7,p8]).then(function(){applySup();var loc=null;try{loc=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){} OUT=merge(FILE,loc);migrateLegacy();save(false);render();});}
function parseRows(html){var doc=new DOMParser().parseFromString(html,'text/html');var tb=doc.querySelector('#tb');var table=tb?tb.closest('table'):doc.querySelector('table');var hr=[].slice.call(table.querySelectorAll('tr')).filter(function(r){return r.querySelector('th')})[0];var H={};[].forEach.call(hr.children,function(c,i){H[c.textContent.replace(/\s+/g,' ').trim()]=i});

/* Item 314: suppression, read once for the whole page from the repository root (suppression.json), applied to every row before anything renders; fail closed when unreadable */
var SUP={readable:false,entries:[]};function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'').toLowerCase()}catch(e){return ''}}
function applySup(){var A={},Dm={};(SUP.entries||[]).forEach(function(e){var a=String(e.address||'').toLowerCase().trim(),d=String(e.domain||'').toLowerCase().trim();if(a)A[a]=e;if(d&&e.scope==='domain'&&(e.reason==='complaint'||e.reason==='do-not-contact'))Dm[d]=e;});
 ROWS.forEach(function(r){var em=((r.email||'').match(/[\w.+-]+@[\w.-]+\.\w+/)||[''])[0].toLowerCase();var d1=em?em.split('@')[1]:'',d2=r.site?hostOf(r.site):'';var hit=!SUP.readable?{reason:'suppression list unreadable \u2014 every address withheld until it reads'}:(A[em]||Dm[d1]||Dm[d2]);
  if(hit){r.suppressed=hit.reason+(hit.date?' ('+hit.date+(hit.market?', from '+hit.market:'')+')':'')+(Dm[d1]===hit||Dm[d2]===hit?' \u2014 domain '+(hit.domain||''):'');if(em){r.emailWithheld=em;}r.email='withheld \u2014 '+r.suppressed;}});}

function readTally(){if(!READS._ok)return 'Site reads: '+MARKET+'-reads.json unreadable';var t={};Object.keys(READS).forEach(function(k){if(k[0]==='_')return;var st=READS[k].state||'';var key=st.indexOf('refused (unconfirmed')===0?'refused, unconfirmed':st;t[key]=(t[key]||0)+1});return 'Site reads (from reads.py): '+Object.keys(t).sort().map(function(k){return k+' '+t[k]}).join(' \u00b7 ')+' \u2014 absence total counts not_found only; refusals are re-runnable'}

function inqHtml(){if(!INQ._ok)return '<div class="note">Intake queue: '+MARKET+'-intake-queue.json unreadable</div>';var ks=Object.keys(INQ).filter(function(k){return k[0]!=='_'});var pend=ks.filter(function(k){return (INQ[k].status||'').indexOf('proposed')===0}).sort(function(a,b){return (INQ[a].practice||'').localeCompare(INQ[b].practice||'')||a.localeCompare(b)});var h='<h3>Intake <span class="note">('+pend.length+' net-new candidate(s) awaiting a named decision \u00b7 tests 3 and 4 are the human\u2019s; a confirmed candidate reaches florida-expansion.html as Unverified only through apply_queue.py)</span></h3>';if(!pend.length)h+='<div class="note">No candidates.</div>';
 pend.slice(0,40).forEach(function(k){var e=INQ[k];var s=e.signal||{};h+='<div class="row" style="align-items:flex-start;flex-wrap:wrap"><div style="flex:1 1 100%"><b>'+esc(e.practice)+' \u00b7 '+esc(e.source)+'</b> \u2014 '+(e.company?'<b>'+esc(e.company)+'</b>':'<i>company not named by the bot \u2014 name it from the signal</i>')+'<div class="mut">\u201c'+esc(s.sentence||'')+'\u201d \u00b7 <a href="'+esc(s.url||'')+'" target="_blank">'+esc(s.url||'')+'</a> \u00b7 published '+esc(s.published||'')+' \u00b7 read '+esc(s.read||'')+'</div><div class="mut">test 1: '+esc(e.test1||'not read')+' \u00b7 test 2: '+esc(e.test2||'')+' \u00b7 band: '+esc(e.band?e.band.why:'not read')+'</div></div><input class="iq" data-k="'+esc(k)+'" data-f="company" placeholder="company (from the signal)" value="'+esc(e.company||'')+'"><input class="iq" data-k="'+esc(k)+'" data-f="test3" placeholder="test 3: practice-fit evidence line"><input class="iq" data-k="'+esc(k)+'" data-f="test4" placeholder="test 4: dated source for the decision maker"><input class="iq" data-k="'+esc(k)+'" data-f="decision_maker" placeholder="decision maker, title"><button class="ik" data-k="'+esc(k)+'" data-d="confirm">Confirm</button><button class="ik" data-k="'+esc(k)+'" data-d="reject">Reject</button></div>'});
 h+='<div class="row"><button id="iqExport">Export intake queue (for the Chair to commit)</button></div>';return h}

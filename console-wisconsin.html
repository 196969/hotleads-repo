 var p4=(window.__drSupP=window.__drSupP||(function(){var L=null,LOK=false;try{L=JSON.parse(localStorage.getItem('dra-suppression')||'null');LOK=!!(L&&Array.isArray(L.entries))}catch(e){}function fin(P,POK,err){var E=[],seen={};function add(x){(x||[]).forEach(function(e){if(!e)return;var k=[String(e.scope||''),String(e.address||'').toLowerCase().trim(),String(e.domain||'').toLowerCase().trim(),String(e.reason||'')].join('|');if(!seen[k]){seen[k]=1;E.push(e)}})}if(POK)add(P.entries);if(LOK)add(L.entries);return {ok:POK||LOK,entries:E,pub:{ok:POK,n:POK?P.entries.length:null,published:POK?String(P.published||''):'',err:err||''},loc:{ok:LOK,n:LOK?L.entries.length:null,date:(LOK&&L._file&&L._file.date)||''}}}return fetch('suppression.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){if(!j||!Array.isArray(j.entries))throw new Error('no entries array');return fin(j,true,'')}).catch(function(e){return fin(null,false,String(e&&e.message||e))}).then(function(R){window.DRA_SUPP=R.ok?R.entries:false;return R})})()).then(function(R){SUP={readable:R.ok,entries:R.entries,sources:R,error:R.ok?'':'published list not readable ('+R.pub.err+') and no local copy'}});   /* Item 372-HL: published list, then this computer\u2019s copy, merged */

function parseRows(html){var doc=new DOMParser().parseFromString(html,'text/html');var tb=doc.querySelector('#tb');var table=tb?tb.closest('table'):doc.querySelector('table');var hr=[].slice.call(table.querySelectorAll('tr')).filter(function(r){return r.querySelector('th')})[0];var H={};[].forEach.call(hr.children,function(c,i){H[c.textContent.replace(/\s+/g,' ').trim()]=i});

var SUP={readable:false,entries:[]};function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'').toLowerCase()}catch(e){return ''}}
